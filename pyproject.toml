[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yasinai"
version = "1.1.4"
description = "YasinAI Modular AI Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=48.0.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4,<10",
    "pytest-cov>=6,<8",
]
lint = [
    "ruff==0.16.3",
]

[project.scripts]
yasin = "yasinai.cli.security_entrypoint:main"

[tool.setuptools.packages.find]
include = [
    "yasinai*",
    "security_platform*",
    "developer_platform*",
    "knowledge_platform*",
    "api_service*",
    "observability*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
branch = true
source = [
    "yasinai",
    "security_platform",
    "developer_platform",
    "knowledge_platform",
    "api_service",
    "observability",
]
omit = [
    "tests/*",
    "developer_platform/sdk_tests.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py39"
line-length = 120
