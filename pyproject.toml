[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yasinai"
version = "1.0.0"
description = "YasinAI Modular AI Platform"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=42,<47",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
yasin = "yasinai.cli.security_entrypoint:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["yasinai", "security_platform", "developer_platform", "knowledge_platform"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
