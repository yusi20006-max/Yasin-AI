services:
  yasinai:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - yasinai-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "yasin", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  yasinai-data:
