name: Docker Build & Smoke Test

# Manual/tag release path only. PR and main push Docker smoke is owned by
# ci.yml (`docker` job) to avoid duplicate image builds on every push.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker Image
        run: docker build --pull -t yasinai:latest .

      - name: Run Smoke Test
        run: docker run --rm yasinai:latest yasin status
