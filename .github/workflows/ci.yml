name: CI Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: python -m pytest --cov=yasinai --cov=security_platform --cov=developer_platform --cov=knowledge_platform --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and audit tooling
        run: python -m pip install --upgrade pip pip-audit && python -m pip install -e ".[test]"

      - name: Audit Python dependencies
        run: python -m pip_audit

      - name: Run repository security check
        run: python -c "from yasinai.cli.security_entrypoint import main; main()" security check

      - name: Check for accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=0
          while IFS= read -r -d '' file; do
            case "$file" in
              ./.git/*|./.venv/*|./venv/*|./node_modules/*|*.example) continue ;;
            esac
            case "$file" in
              *.pem|*.key|*.p12|*.pfx|*.token|*.secret) echo "Forbidden secret-like file: $file"; forbidden=1 ;;
              */.env|./.env|*/.env.*|./.env.*) echo "Forbidden environment file: $file"; forbidden=1 ;;
            esac
          done < <(find . -type f -print0)
          test "$forbidden" -eq 0

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t yasinai:ci .

      - name: Run Docker smoke test
        run: docker run --rm yasinai:ci yasin status
